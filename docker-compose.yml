# Local PostgreSQL for development. Values come from .env (see .env.example).
# Start: docker compose up -d    Stop: docker compose down
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume: the data survives `docker compose down` and restarts.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The container is "healthy" only once the database accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
