# Runs the checks on every pull request and after every merge into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL that exists only while this job runs, for the
    # integration tests in ingestion/tests/test_load.py.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: leu_watch
          POSTGRES_USER: leu_watch
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leu_watch -d leu_watch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Read by ingestion/config.py, as the .env file is locally.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: leu_watch
      POSTGRES_USER: leu_watch
      POSTGRES_PASSWORD: ci-only-not-a-secret

    steps:
      # Actions are pinned to a commit SHA: unlike a tag, it cannot be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -rs
